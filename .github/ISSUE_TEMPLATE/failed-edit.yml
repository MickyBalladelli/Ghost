name: Failed edit
description: Report an edit, diff, conflict, approval, rollback, or verification failure.
title: "[Edit] "
labels:
  - editing
body:
  - type: markdown
    attributes:
      value: |
        Do not paste private source code, credentials, tokens, or full workspace paths. Share a small redacted example only.
  - type: input
    id: versions
    attributes:
      label: Versions and platform
      description: Ghost version, VS Code version, OS, provider, and model.
    validations:
      required: true
  - type: dropdown
    id: tool
    attributes:
      label: Edit tool
      options:
        - ghost_write_file
        - ghost_apply_edit
        - ghost_apply_transaction
        - diff preview or restore
        - approval or verification
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Exact error
      description: Paste the concise redacted error shown by Ghost.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include whether the file had unsaved editor changes and whether it was read immediately before editing.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
  - type: textarea
    id: redacted_context
    attributes:
      label: Small redacted context
      description: If relevant, include hunk shape, file type, line range, or conflict condition without private code.
