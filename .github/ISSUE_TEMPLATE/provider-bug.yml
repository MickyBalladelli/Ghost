name: Provider bug
description: Report a provider connection, model, streaming, capability, or request-format problem.
title: "[Provider] "
labels:
  - provider
body:
  - type: markdown
    attributes:
      value: |
        Do not include API keys, private URLs, workspace code, or personal data. Redact logs and request payloads first.
  - type: input
    id: provider
    attributes:
      label: Provider
      description: Ollama, MLX/VLM, OpenAI-compatible, or compatibility profile.
      placeholder: Ollama / MLX-VLM / vLLM
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model
      placeholder: qwen2.5-coder:7b
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions and platform
      description: Ghost version, VS Code version, OS, and provider/server version.
      placeholder: Ghost 1.1.19, VS Code 1.125, macOS, Ollama 0.x
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: Tell us the smallest request that shows the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics
      description: Include the visible error and capability details. Remove secrets and private paths.
